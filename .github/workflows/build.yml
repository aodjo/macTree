name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build MacTree.app
        env:
          SIGN_IDENTITY: "-"
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          swift --version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-app.sh

      - name: Smoke test
        run: |
          lipo build/MacTree.app/Contents/MacOS/MacTree -verify_arch arm64 x86_64
          build/MacTree.app/Contents/MacOS/MacTree --bench "$GITHUB_WORKSPACE/Sources"
          codesign --verify --deep --strict build/MacTree.app

      - name: Package
        run: ditto -c -k --keepParent build/MacTree.app MacTree.zip

      - uses: actions/upload-artifact@v7
        with:
          name: MacTree
          path: MacTree.zip
          if-no-files-found: error
