name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build MacTree.app
        env:
          SIGN_IDENTITY: "-"
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          swift --version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-app.sh

      - name: Smoke test
        run: |
          build/MacTree.app/Contents/MacOS/MacTree --bench "$GITHUB_WORKSPACE/Sources"
          codesign --verify --deep --strict build/MacTree.app

      - name: Package
        run: ditto -c -k --keepParent build/MacTree.app MacTree.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacTree
          path: MacTree.zip
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacTree

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv MacTree.zip "MacTree-${GITHUB_REF_NAME}.zip"
          cat > notes.md <<'NOTES'
          WizTree-style disk space analyzer for macOS 15 or later (Apple silicon and Intel).

          **Install:** unzip, move `MacTree.app` to Applications, and open it. The build is ad-hoc signed and not notarized, so macOS blocks the first launch. To allow it, go to System Settings › Privacy & Security and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/MacTree.app`.

          For complete results, allow **Full Disk Access** when MacTree asks.
          NOTES
          gh release create "$GITHUB_REF_NAME" "MacTree-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MacTree ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes
